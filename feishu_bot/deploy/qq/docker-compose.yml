services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qq_napcat
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./napcat_data:/app/napcat_data   # 登录凭证持久化，防止掉线重扫
    ports:
      - "6099:6099"   # NapCat WebUI（扫码登录、反向 WS 配置）
      - "3000:3000"   # NapCat 面板备用端口

  feishu-bot:
    build:
      context: ../..
      dockerfile: deploy/qq/Dockerfile
    container_name: qq_feishu_bot
    restart: always
    environment:
      QQ_ENABLE: "true"
      ONEBOT_WS_HOST: 0.0.0.0
      ONEBOT_WS_PORT: "8081"
      QQ_GROUP_ID: ${QQ_GROUP_ID:?请在 .env 中配置目标QQ群号}
      QQ_HISTORY_DAYS: ${QQ_HISTORY_DAYS:-7}
      QQ_FILE_POLL_INTERVAL: ${QQ_FILE_POLL_INTERVAL:-900}
      QQ_STATE_PATH: /data/qq_processed_ids.json
      AISTOCK_API_URL: ${AISTOCK_API_URL:?请在 .env 中配置业务后端地址}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env 中配置内部接口令牌}
      DOWNLOAD_DIR: /data/downloads
    volumes:
      - ./bot_data:/data                # 下载文件 + 去重状态持久化
    depends_on:
      - napcat
